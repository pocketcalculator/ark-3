[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark3-device"
version = "0.1.0"
description = "Raspberry Pi Zero 2 W capture client for ark-3"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
ark3-capture = "ark3_device.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
